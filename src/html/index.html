<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration / Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/bed-ca2-Dinozo123/frontend/src/css/styles.css">
    <link rel="stylesheet" href="/bed-ca2-Dinozo123/frontend/src/css/login.css">
</head>
<body>
    <!-- Sticky Navbar -->
    <nav class="navbar navbar-expand-lg justify-content-between sticky-top" style="padding: 15px;" id="navbar">
      <img src="../../images/BTD6Logo.png" width="8%" class="d-inline-block" alt="">
      
      <div class="container d-flex" id="navbarButtons">
          <ul class="list-group list-group-horizontal list-inline fs-4 mx-4">
              <li class="nav-item"><a class="nav-link btn me-4" href="profile.html">Profile</a></li>
              <li class="nav-item"><a class="nav-link btn me-4" href="Monkeys.html">Monkey</a></li>
              <li class="nav-item"><a class="nav-link btn me-4" href="challenge.html">Challenges</a></li>
          </ul>
          <!-- Push the Log In button to the right -->
          <a class="nav-link ms-auto" href="index.html">
              Log In
          </a>
      </div>
  </nav>
    

<!-- Tab Navigation -->
<ul class="nav nav-tabs d-flex justify-content-center align-items-center" id="authTab" role="tablist">
    <li class="nav-item" role="presentation">
        <a class="nav-link active" id="loginTab" data-bs-toggle="tab" href="#login" role="tab" aria-controls="login" aria-selected="true">Login</a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link" id="registerTab" data-bs-toggle="tab" href="#register" role="tab" aria-controls="register" aria-selected="false">Register</a>
    </li>
</ul>

<!-- Tab Content -->
<div class="tab-content mt-4">
    <!-- Login Form -->
    <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="loginTab">
        <main class="py-4">
            <div class="container">
                <div class="row justify-content-center mt-5">
                    <div class="col-md-6 px-5">
                        <h3 class="mb-4 text-center">Login</h3>
                        <form id="loginForm">
                            <div class="form-group pb-3">
                                <label for="usernameLogin">Username</label>
                                <input type="text" class="form-control" id="usernameLogin" required>
                            </div>
                            <div class="form-group pb-3">
                                <label for="passwordLogin">Password</label>
                                <input type="password" class="form-control" id="passwordLogin" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Login</button>
                        </form>
                        <div id="warningCard" class="card border-danger mt-3 mb-3 d-none">
                            <div class="card-body text-danger">
                                <p id="warningText" class="card-text"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Register Form -->
    <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="registerTab">
        <main class="py-4">
            <div class="container">
                <div class="row justify-content-center mt-5">
                    <div class="col-md-6 px-5">
                        <h3 class="mb-4 text-center">Register</h3>
                        <form id="registerForm">
                            <div class="form-group mb-4">
                                <label for="usernameReg">Username</label>
                                <input type="text" class="form-control" id="usernameReg" required>
                            </div>
                            <div class="form-group mb-4">
                                <label for="emailReg">Email</label>
                                <input type="email" class="form-control" id="emailReg" required>
                            </div>
                            <div class="form-group mb-4">
                                <label for="passwordReg">Password</label>
                                <input type="password" class="form-control" id="passwordReg" required>
                            </div>
                            <div class="form-group mb-4">
                                <label for="confirmPasswordReg">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPasswordReg" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block mb-4">Signup</button>
                        </form>
                        <div id="warningCard" class="card border-danger mb-3 d-none">
                            <div class="card-body text-danger">
                                <p id="warningText" class="card-text"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

  

    <script src='../js/login.js'></script>
    <script src='../js/navbar.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
