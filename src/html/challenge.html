<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration / Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/bed-ca2-Dinozo123/frontend/src/css/styles.css">
    <link rel="stylesheet" href="/bed-ca2-Dinozo123/frontend/src/css/challenge.css">
</head>
<body>
    <!-- Sticky Navbar -->
    <nav class="navbar navbar-expand-lg justify-content-between sticky-top" style="padding: 15px;" id="navbar">
        <img src="../../images/BTD6Logo.png" width="8%" class="d-inline-block" alt="">
        
        <div class="container d-flex" id="navbarButtons">
            <ul class="list-group list-group-horizontal list-inline fs-4 mx-4">
                <li class="nav-item"><a class="nav-link btn me-4" href="profile.html">Profile</a></li>
                <li class="nav-item"><a class="nav-link btn me-4" href="Monkeys.html">Monkey</a></li>
                <li class="nav-item"><a class="nav-link btn me-4" href="challenge.html">Challenges</a></li>
            </ul>
            <!-- Push the Log In button to the right -->
            <a class="nav-link ms-auto" href="index.html">
                Log In
            </a>
        </div>
    </nav>

    <div id="skillPointsBalanceContainer">
        <p>Skill Points: <span id="skillPointsBalanceText">Loading...</span></p>
    </div>

    <section>
    <div id="createChallengeFormContainer" class="w-50 mx-auto">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <h5 class="card-title text-center">Create New Challenge</h5>
                <form id="createChallengeForm">
                    <div class="mb-3">
                        <label for="createChallengeTitle" class="form-label">Title:</label>
                        <input type="text" id="createChallengeTitle" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="createSkillPoints" class="form-label">Skill Points:</label>
                        <input type="number" id="createSkillPoints" class="form-control" required>
                    </div>

                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-success w-50">Create</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <button id="cancelCreateChallengeBtn" class="btn btn-danger">Cancel</button>
                </div>
            </div>
        </div>
    </div>

        <div class="container">
            <div class="row g-5 mt-5 d-flex flex-wrap" id="challengeContainer">
                
            </div>          
            <!-- Container for challenge cards -->
            </div>
        </div>
    </section>

    <div class="container mt-5">
        <h2>Challenge Reviews</h2>
        
        <!-- Review Form -->
        <div id="reviewForm">
            <h4>Leave a Review</h4>
            <div class="star-rating" id="starRating">
                <span class="star" data-value="1">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="5">&#9733;</span>
            </div>
            <textarea id="reviewText" class="form-control my-3" placeholder="Write your review"></textarea>
            <button class="btn btn-primary" id="submitReviewBtn">Submit Review</button>
        </div>

        <!-- Reviews List -->
        <h4 class="mt-5">All Reviews</h4>
        <div id="reviewsList"></div>
    </div>

    <script src='../js/navbar.js'></script>
    <script src='../js/challenge.js'></script>
    <script src='../js/review.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
