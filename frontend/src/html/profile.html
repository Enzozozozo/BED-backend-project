<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/bed-ca2-Dinozo123/frontend/src/css/styles.css">
  <link rel="stylesheet" href="/bed-ca2-Dinozo123/frontend/src/css/profile.css">
</head>
<body>
    <!-- Sticky Navbar -->
    <nav class="navbar navbar-expand-lg justify-content-between sticky-top" style="padding: 15px;" id="navbar">
      <img src="../../images/BTD6Logo.png" width="8%" class="d-inline-block" alt="">
      
      <div class="container d-flex" id="navbarButtons">
          <ul class="list-group list-group-horizontal list-inline fs-4 mx-4">
              <li class="nav-item"><a class="nav-link btn me-4" href="profile.html">Profile</a></li>
              <li class="nav-item"><a class="nav-link btn me-4" href="Monkeys.html">Monkey</a></li>
              <li class="nav-item"><a class="nav-link btn me-4" href="challenge.html">Challenges</a></li>
          </ul>
          <!-- Push the Log In button to the right -->
          <a class="nav-link ms-auto" href="index.html">
              Log In
          </a>
      </div>
  </nav>

  <div class="container mt-5" id="profileContainer">
    <div class="row">
      <div class="col-md-4">
        <div class="mb-3 text-center">
        </div>
      </div>  
      <div class="col-md-12" id="inventoryContainer">
        <h2 style="font-family: IntegralCF;">Inventory</h2>
        <button class="btn btn-primary" id="upgradeContainerBtn">Upgrade</button>
        <div class="flex-nowrap inventoryGrid" id="inventoryGrid">
          <!-- DYNAMIC INVENTORY ITEMS -->
        </div> 
        <div class="d-flex flex-column justify-content-center mt-3">
          <div class="d-flex justify-content-between" id="inventoryBtn">
            <button class="btn btn-primary mx-2" id="backPageBtn">Previous Page</button>
            <div>
              <span id="pageNumber"></span> 
            </div>
            <button class="btn btn-primary mx-2" id="nextPageBtn">Next Page</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  
<section>
  <div class="container mt-5" id="upgradeContainer" style="display: none">
    <div class="text-center" id="upgradeContainerText">
      Forge a paragon monkey!!
    </div>
    <div class="d-flex flex-column align-items-center" id="upgradeContainerIcon">
      <div id="anvilTop" class="d-flex justify-content-around align-items-center py-5">
        <div class="btn inventoryItem" id="upgradeItem1"></div>
        <div class="btn inventoryItem" id="upgradeItem2"></div>
        <div class="btn inventoryItem" id="upgradeItem3"></div>
      </div>
      <div id="anvilNeck" class="d-flex justify-content-center">
        <div class="btn upgradedItem" id="upgradedItem">Upgrade!</div>
      </div>
    </div>
    <button class="btn btn-secondary" id="upgradeContainerBackBtn">Back to Inventory</button>
  </div>

  <!-- Inventory Modal -->
  <div class="modal fade" id="inventoryGridModal" tabindex="-1" aria-labelledby="inventoryGridModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inventoryGridModalLabel">Inventory</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="ModalinventoryGrid" class="d-grid gap-2">
            <!-- DYNAMIC INVENTORY ITEMS -->
          </div>
          <div id="modalPagination" class="d-flex justify-content-between mt-3">
            <button id="backPageBtnModal" class="btn btn-secondary">Previous</button>
            <div>
              <span id="pageNumberModal"></span> 
            </div>
            <button id="nextPageBtnModal" class="btn btn-secondary">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

      <script src='../js/navbar.js'></script>
      <script src='../js/dartmonkey.js'></script>
      <script src='../js/profile.js'></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
